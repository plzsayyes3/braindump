<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="禅ノートv3">
<title>禅ノート v3 - AI漢字変換</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Zen+Old+Mincho:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C1B19;
    --paper:#EAE4D8;
    --muted:#8C8577;
    --hairline:#33312C;
    --hanko:#B23A2E;
    --hanko-glow:rgba(178,58,46,0.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100dvh;}
  body{
    background:var(--bg);
    color:var(--paper);
    font-family:'Noto Serif JP','Zen Old Mincho', serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* spine label */
  .spine{
    position:fixed;
    left:clamp(14px, 3vw, 36px);
    top:50dvh;
    transform:translateY(-50%);
    writing-mode:vertical-rl;
    letter-spacing:0.5em;
    font-size:15px;
    color:var(--muted);
    opacity:0.55;
    user-select:none;
    pointer-events:none;
  }
  .spine .dot{
    display:block;
    width:4px;height:4px;
    border-radius:50%;
    background:var(--hanko);
    margin:0 auto 14px;
    opacity:0.8;
  }

  /* タイプライター表示域: 1行だけ見える窓。画面中央に直接固定する。
     (このtypewriter自体をflexで中央寄せする構成だと、display:flex祖先の中で
     position:relative + overflow:hidden を持つ要素の子の絶対配置が崩れる環境があったため、
     position:fixed + left:50%/top:50dvh + transform で直接中央固定する構成にしている) */
  .typewriter{
    position:fixed;
    left:50%;
    top:50dvh;
    transform:translate(-50%, -50%);
    width:min(680px, 86vw);
    height:44px;
    overflow:hidden;
    /* 中央(=今打っている文字)がはっきり見え、そこから離れるほど薄くなるフェード */
    -webkit-mask-image: linear-gradient(
      to right,
      transparent 0%,
      rgba(0,0,0,0.18) 12%,
      rgba(0,0,0,0.65) 32%,
      black 46%,
      black 54%,
      rgba(0,0,0,0.65) 68%,
      rgba(0,0,0,0.18) 88%,
      transparent 100%
    );
    mask-image: linear-gradient(
      to right,
      transparent 0%,
      rgba(0,0,0,0.18) 12%,
      rgba(0,0,0,0.65) 32%,
      black 46%,
      black 54%,
      rgba(0,0,0,0.65) 68%,
      rgba(0,0,0,0.18) 88%,
      transparent 100%
    );
  }
  /* フォーカスポイント: 今打っている文字を囲む角丸の枠 */
  .caret-guide{
    position:absolute;
    left:50%;
    top:50%;
    width:28px;
    height:34px;
    transform:translate(-50%, -50%);
    border:1.5px solid var(--hanko);
    border-radius:8px;
    background:rgba(178,58,46,0.08);
    opacity:0.85;
    pointer-events:none;
  }
  #editor{
    position:absolute;
    top:0; left:50%;
    height:44px;
    width:6000px; /* 内部で折り返し/自前スクロールが起きないよう十分大きく確保 */
    white-space:pre;
    background:transparent;
    border:none;
    outline:none;
    margin:0;
    color:var(--paper);
    font-family:'Noto Serif JP','Zen Old Mincho', serif;
    font-weight:300;
    font-size:19px;
    line-height:44px;
    padding:0;
    /* iOS標準のフォーム部品の見た目・内部余白を消し、CSSで指定した位置と実際の描画がズレないようにする */
    appearance:none;
    -webkit-appearance:none;
    border-radius:0;
    will-change:transform;
  }
  #editor::placeholder{
    color:var(--muted);
    opacity:0.55;
  }

  /* 現在行が画面幅を超えてあふれた分を積み上げる、上段の履歴行 */
  .history-row{
    position:fixed;
    left:50%;
    width:min(680px, 86vw);
    height:44px;
    line-height:44px;
    overflow:hidden;
    white-space:pre;
    text-align:right;
    font-family:'Noto Serif JP','Zen Old Mincho', serif;
    font-weight:300;
    font-size:19px;
    color:var(--paper);
    pointer-events:none;
    transform:translateX(-50%);
    transition:opacity .15s ease;
  }

  /* settings gear */
  .gear{
    position:fixed;
    top:calc(22px + env(safe-area-inset-top)); right:calc(26px + env(safe-area-inset-right));
    width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    color:var(--muted);
    opacity:0.28;
    cursor:pointer;
    transition:opacity .3s ease, transform .4s ease;
    background:none; border:none;
  }
  .gear:hover{ opacity:0.9; transform:rotate(35deg); }
  .gear svg{ width:17px; height:17px; }

  /* status row */
  .status{
    position:fixed;
    bottom:calc(22px + env(safe-area-inset-bottom));
    left:0; right:0;
    display:flex;
    justify-content:center;
  }
  .status-inner{
    width:min(680px, 86vw);
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.03em;
  }
  .count{ opacity:0.7; }
  .status-actions{ display:flex; align-items:center; gap:16px; }
  .save-hint{
    cursor:pointer;
    opacity:0.75;
    transition:opacity .2s, color .2s;
    background:none; border:none;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.03em;
  }
  .save-hint:hover{ opacity:1; color:var(--paper); }
  .save-hint:disabled{ opacity:0.3; cursor:default; }

  .err{
    position:fixed;
    bottom:calc(52px + env(safe-area-inset-bottom)); left:0; right:0;
    display:flex; justify-content:center;
    pointer-events:none;
  }
  .err-inner{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--hanko);
    background:var(--hanko-glow);
    padding:6px 12px;
    border-radius:2px;
    opacity:0;
    transition:opacity .3s ease;
  }
  .err-inner.show{ opacity:1; }

  /* hanko stamp */
  .hanko-stamp{
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%) scale(0.4) rotate(-8deg);
    width:104px; height:104px;
    border:3px solid var(--hanko);
    border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    color:var(--hanko);
    font-family:'Zen Old Mincho', serif;
    font-size:44px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s cubic-bezier(.2,1.4,.4,1);
    box-shadow:0 0 40px var(--hanko-glow);
  }
  .hanko-stamp.stamped{
    opacity:0.92;
    transform:translate(-50%,-50%) scale(1) rotate(-8deg);
  }
  .hanko-stamp.fadeout{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.08) rotate(-8deg);
    transition:opacity .6s ease, transform .6s ease;
  }

  /* settings modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(10,10,9,0.72);
    display:none;
    align-items:center; justify-content:center;
    z-index:20;
  }
  .overlay.open{ display:flex; }
  .modal{
    width:min(400px, 88vw);
    background:#211F1C;
    border:1px solid var(--hairline);
    border-radius:4px;
    padding:28px 26px 22px;
    max-height:86vh;
    overflow-y:auto;
  }
  .modal h2{
    font-size:15px;
    font-weight:400;
    letter-spacing:0.08em;
    color:var(--paper);
    margin-bottom:4px;
  }
  .modal .sub{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--muted);
    margin-bottom:20px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--muted);
    margin-bottom:6px;
    letter-spacing:0.04em;
  }
  .field input{
    width:100%;
    background:#171614;
    border:1px solid var(--hairline);
    border-radius:3px;
    padding:9px 10px;
    color:var(--paper);
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    outline:none;
  }
  .field input:focus{ border-color:var(--muted); }
  .modal-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
  }
  .btn{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.03em;
    padding:9px 16px;
    border-radius:3px;
    cursor:pointer;
    border:1px solid transparent;
  }
  .btn-primary{
    background:var(--hanko);
    color:#F4EDE4;
    border-color:var(--hanko);
  }
  .btn-primary:hover{ opacity:0.9; }
  .btn-ghost{
    background:none;
    color:var(--muted);
    border-color:var(--hairline);
  }
  .btn-ghost:hover{ color:var(--paper); }
</style>
</head>
<body>

  <div class="spine"><span class="dot"></span>禅モード</div>

  <button class="gear" id="gearBtn" title="設定" aria-label="設定">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>

  <div id="historyRows"></div>

  <div class="typewriter" id="typewriter">
    <div class="caret-guide"></div>
    <input id="editor" type="text" placeholder="書き始める……" autofocus
           autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off">
  </div>

  <div class="status">
    <div class="status-inner">
      <span class="count" id="count">0字</span>
      <div class="status-actions">
        <button class="save-hint" id="convertBtn">漢字変換</button>
        <button class="save-hint" id="saveBtn">投稿する（⌘+Enter）</button>
      </div>
    </div>
  </div>

  <div class="err"><div class="err-inner" id="errBox"></div></div>

  <div class="hanko-stamp" id="stamp">済</div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2>接続設定</h2>
      <div class="sub">GitHub Personal Access Token が必要です（対象リポジトリの Contents: Read and write）</div>

      <div class="field">
        <label>Token</label>
        <input type="password" id="f-token" placeholder="github_pat_xxxxxxxxxxxx" autocomplete="off">
      </div>
      <div class="field">
        <label>リポジトリ所有者</label>
        <input type="text" id="f-owner" placeholder="例: plzsayyes3">
      </div>
      <div class="field">
        <label>リポジトリ名</label>
        <input type="text" id="f-repo" placeholder="例: mynotebook">
      </div>
      <div class="field">
        <label>ブランチ</label>
        <input type="text" id="f-branch" placeholder="main">
      </div>
      <div class="field">
        <label>保存フォルダ</label>
        <input type="text" id="f-folder" placeholder="00_inbox">
      </div>

      <div class="field" style="margin-top:22px; padding-top:16px; border-top:1px solid var(--hairline);">
        <label>Gemini API Key（漢字変換用）</label>
        <input type="password" id="f-gemini-key" placeholder="AIza..." autocomplete="off">
      </div>
      <div class="field">
        <label>Gemini モデル</label>
        <input type="text" id="f-gemini-model" placeholder="gemini-3.6-flash">
      </div>
      <div class="sub" style="margin-top:-6px; margin-bottom:0;">
        無料枠のAPIキーは学習に利用される場合があります。避けたい場合は課金登録済みの有料枠キーを使ってください。
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" id="clearBtn">接続を解除</button>
        <button class="btn btn-primary" id="saveSettingsBtn">保存して閉じる</button>
      </div>
    </div>
  </div>

<script>
"use strict";

// このアプリの初期値（未設定時のプリセット。設定画面でいつでも変更可能）
const DEFAULTS = {
  owner: "plzsayyes3",
  repo: "mynotebook",
  branch: "main",
  folder: "00_inbox",
  geminiModel: "gemini-3.6-flash",
};

const editor = document.getElementById('editor');
const typewriter = document.getElementById('typewriter');
const countEl = document.getElementById('count');
const saveBtn = document.getElementById('saveBtn');
const convertBtn = document.getElementById('convertBtn');
const gearBtn = document.getElementById('gearBtn');
const overlay = document.getElementById('overlay');
const stamp = document.getElementById('stamp');
const errBox = document.getElementById('errBox');

const fToken = document.getElementById('f-token');
const fOwner = document.getElementById('f-owner');
const fRepo = document.getElementById('f-repo');
const fBranch = document.getElementById('f-branch');
const fGeminiKey = document.getElementById('f-gemini-key');
const fGeminiModel = document.getElementById('f-gemini-model');
const fFolder = document.getElementById('f-folder');

let settings = null;
let draftTimer = null;

// ---- タイプライター用の状態 ----
// Enterで「確定して不可視化」された行 = fullText。今キャレットが動いている行だけが editor.value に生きている。
let fullText = '';
let isComposing = false; // IME変換中はEnterを横取りしない

function showError(msg){
  errBox.textContent = msg;
  errBox.classList.add('show');
  setTimeout(()=> errBox.classList.remove('show'), 4200);
}

function currentFullText(){
  return fullText + editor.value;
}

function updateCount(){
  countEl.textContent = currentFullText().length + '字';
}

// ---- キャレット位置の計測（実際のDOMに同じスタイルのミラー要素を用意して幅を測る）----
// canvasのmeasureTextだと実際のinput描画とごく僅かにズレることがあるため、
// 見た目と完全に同じレンダリングパイプラインで測れるDOMミラー方式にしている
const measureMirror = document.createElement('span');
measureMirror.style.cssText = 'position:absolute; left:-9999px; top:-9999px; visibility:hidden; white-space:pre;';
document.body.appendChild(measureMirror);
function syncMeasureFont(){
  const cs = getComputedStyle(editor);
  measureMirror.style.font = cs.font;
  measureMirror.style.letterSpacing = cs.letterSpacing;
}
function measureTextWidth(text){
  measureMirror.textContent = text;
  return measureMirror.getBoundingClientRect().width;
}
function updateCaretPosition(){
  // IME変換中はブラウザによってselectionStartの扱いが揺れることがあるため、
  // 変換中は素直に「今の文字列の末尾」を基準にする
  const pos = isComposing ? editor.value.length : (editor.selectionStart ?? editor.value.length);
  const before = editor.value.slice(0, pos);
  const width = measureTextWidth(before);
  editor.style.transform = `translateX(${-width}px)`;
  // 確定済み(Enterで持ち上がった)行も含めて表示する
  updateHistoryRows(fullText + before);
}

// 文字列の「末尾」から数えて、maxWidthPx に収まる最大の接尾辞を返す
function suffixFit(text, maxWidthPx){
  if (text.length === 0) return { text: '', startIndex: 0 };
  let lo = 0, hi = text.length;
  while (lo < hi) {
    const mid = Math.ceil((lo + hi) / 2);
    const w = measureTextWidth(text.slice(text.length - mid));
    if (w <= maxWidthPx) lo = mid; else hi = mid - 1;
  }
  return { text: text.slice(text.length - lo), startIndex: text.length - lo };
}

// 1行分の文字列を、画面幅いっぱいずつの段に区切る(末尾側が先に埋まる)
function wrapFullWidth(text, rowWidthPx){
  const out = [];
  let remaining = text;
  if (remaining.length === 0) return out;
  while (remaining.length > 0) {
    const fit = suffixFit(remaining, rowWidthPx);
    if (fit.text.length > 0) {
      out.unshift(fit.text);
      remaining = remaining.slice(0, fit.startIndex);
    } else {
      // 極端に幅が狭い等で1文字も入らない場合のフォールバック
      out.unshift(remaining.slice(-1));
      remaining = remaining.slice(0, -1);
    }
  }
  return out;
}

const historyRowsEl = document.getElementById('historyRows');
let historyRowPool = [];

// これまでの全文(改行で区切られた確定済みの行＋今打っている行)を、
// 画面幅いっぱいずつの段に区切って上へ積み上げて表示する。
// Enterで区切られた行は、幅に関わらずそこで必ず段が変わる(=1行持ち上がる)。
function updateHistoryRows(textUpToCaret){
  const rowWidthPx = typewriter.clientWidth;
  const halfWidthPx = rowWidthPx / 2;

  const lines = textUpToCaret.split('\n');
  const currentLine = lines.pop(); // 今打っている(まだ確定していない)行

  const rows = [];
  for (const line of lines) {
    if (line.length === 0) {
      rows.push(''); // 空行でも1段分の余白として持ち上げる
    } else {
      rows.push(...wrapFullWidth(line, rowWidthPx));
    }
  }

  // 今打っている行: 下段(中央から左半分)に収まる分を除いた、それより古い部分を積む
  const bottomFit = suffixFit(currentLine, halfWidthPx);
  const beforeBottom = currentLine.slice(0, bottomFit.startIndex);
  rows.push(...wrapFullWidth(beforeBottom, rowWidthPx));

  // DOM反映(プールを使い回す)
  while (historyRowPool.length < rows.length) {
    const div = document.createElement('div');
    div.className = 'history-row';
    historyRowsEl.appendChild(div);
    historyRowPool.push(div);
  }
  rows.forEach((text, i) => {
    const div = historyRowPool[i];
    div.textContent = text;
    // rows[rows.length-1]が下段のすぐ上(K=1)、rows[0]が一番上
    const k = rows.length - i;
    div.style.top = `calc(50dvh - 22px - ${k * 44}px)`;
    // 古い(上にある)段ほど薄くする
    div.style.opacity = String(Math.max(0.08, 1 - k * 0.22));
    div.style.display = '';
  });
  for (let i = rows.length; i < historyRowPool.length; i++) {
    historyRowPool[i].style.display = 'none';
  }
}

async function loadSettings(){
  try{
    const raw = localStorage.getItem('zen:settings:github');
    if(raw){ settings = JSON.parse(raw); }
  }catch(e){ /* no settings saved yet */ }
}

async function saveSettings(){
  const prev = settings || {};
  // Token/Gemini Keyは空欄のまま保存すると、既存の有効な値を空文字で
  // 上書きして壊してしまうので、空欄なら「前の値を維持」する
  const obj = {
    token: fToken.value.trim() || prev.token || '',
    owner: fOwner.value.trim() || DEFAULTS.owner,
    repo: fRepo.value.trim() || DEFAULTS.repo,
    branch: fBranch.value.trim() || DEFAULTS.branch,
    folder: (fFolder.value.trim() || DEFAULTS.folder).replace(/^\/+|\/+$/g,''),
    geminiKey: fGeminiKey.value.trim() || prev.geminiKey || '',
    geminiModel: fGeminiModel.value.trim() || DEFAULTS.geminiModel,
  };
  try{
    localStorage.setItem('zen:settings:github', JSON.stringify(obj));
    settings = obj;
    overlay.classList.remove('open');
  }catch(e){
    showError('設定の保存に失敗しました');
  }
}

async function clearSettings(){
  try{
    localStorage.removeItem('zen:settings:github');
  }catch(e){}
  settings = null;
  fToken.value=''; fOwner.value=''; fRepo.value=''; fBranch.value=''; fFolder.value='';
  fGeminiKey.value=''; fGeminiModel.value='';
  overlay.classList.remove('open');
}

function openSettings(){
  const s = settings || {};
  fToken.value = s.token || '';
  fOwner.value = s.owner || DEFAULTS.owner;
  fRepo.value = s.repo || DEFAULTS.repo;
  fBranch.value = s.branch || DEFAULTS.branch;
  fFolder.value = s.folder || DEFAULTS.folder;
  fGeminiKey.value = s.geminiKey || '';
  fGeminiModel.value = s.geminiModel || DEFAULTS.geminiModel;
  overlay.classList.add('open');
}

async function loadDraft(){
  try{
    const raw = localStorage.getItem('zen:draft:current');
    if(raw){
      // 最後の改行までを確定済みの行(fullText)、残りを現在編集中の行として復元
      const idx = raw.lastIndexOf('\n');
      if(idx === -1){
        fullText = '';
        editor.value = raw;
      }else{
        fullText = raw.slice(0, idx + 1);
        editor.value = raw.slice(idx + 1);
      }
    }
  }catch(e){ /* no draft */ }
}

function scheduleDraftSave(){
  clearTimeout(draftTimer);
  draftTimer = setTimeout(()=>{
    try{
      localStorage.setItem('zen:draft:current', currentFullText());
    }catch(e){ /* silent - draft save is best-effort */ }
  }, 900);
}

function pad(n){ return String(n).padStart(2,'0'); }

// 既存の 00_inbox ファイル名規則 (例: 20260817223019.md) に合わせ、区切り文字なしのYYYYMMDDHHMMSS
function timestampName(){
  const d = new Date();
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}

function b64EncodeUnicode(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (_, p1) =>
    String.fromCharCode(parseInt(p1, 16))
  ));
}

function playStamp(){
  stamp.classList.remove('fadeout');
  stamp.classList.add('stamped');
  setTimeout(()=>{
    stamp.classList.add('fadeout');
    stamp.classList.remove('stamped');
  }, 900);
}

// Enter: 今の行を確定して見えなくする（=最初から打ち始めたのと同じ状態にリセット）
function commitLine(){
  fullText += editor.value + '\n';
  editor.value = '';
  updateCaretPosition();
  updateCount();
  scheduleDraftSave();
}

// 直前にEnterで持ち上げた行を、fullTextから取り出して下段に戻す(commitLineの逆操作)
function popLastLine(){
  if (fullText.length === 0) return null;
  const withoutTrailingNL = fullText.slice(0, -1); // 末尾の\nを除く
  const idx = withoutTrailingNL.lastIndexOf('\n');
  const line = idx === -1 ? withoutTrailingNL : withoutTrailingNL.slice(idx + 1);
  fullText = idx === -1 ? '' : withoutTrailingNL.slice(0, idx + 1);
  return line;
}

// 積み上がっている全文(確定済みの行＋現在行)を、Gemini APIでかな→漢字混じり表記に変換する
// Gemini generateContent を1回呼ぶ。エラー時はレスポンス本文をできるだけ読み取ってメッセージにする
async function callGeminiGenerateContent(model, prompt, apiKey){
  const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
  const res = await fetch(apiUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
  });
  if(!res.ok){
    const bodyText = await res.text().catch(()=>'');
    let message = `Gemini API error (${res.status})`;
    try{
      const errData = JSON.parse(bodyText);
      message = errData.error?.message || message;
    }catch(_e){
      if(bodyText) message = bodyText.slice(0, 300);
    }
    throw new Error(message);
  }
  return res.json();
}

async function doConvert(){
  const text = currentFullText();
  if(!text.trim()) return;

  if(!settings || !settings.geminiKey){
    openSettings();
    showError('先にGemini APIキーを設定してください');
    return;
  }

  convertBtn.disabled = true;
  convertBtn.textContent = '変換中…';

  const prompt = [
    'あなたは日本語の表記変換だけを行うツールです。',
    '以下の文章は、ひらがな中心で書かれた日本語のメモです。',
    '意味・言い回し・行数・改行位置はできるだけ変えずに、次の2つを行ってください。',
    '(1) 一般的な語（名詞・動詞・形容詞など）に加え、人名・地名・商標名などの固有名詞も含めて、',
    '    適切な常用漢字・一般的な表記に変換する。',
    '(2) 明らかな誤字・脱字・打ち間違いがあれば、自然な形に修正する。',
    '前置きや説明、コードブロックは付けず、変換後の文章のみを、入力と同じ行数で出力してください。',
    '',
    '---',
    text,
  ].join('\n');

  let model = settings.geminiModel || DEFAULTS.geminiModel;

  try{
    let data;
    try{
      data = await callGeminiGenerateContent(model, prompt, settings.geminiKey);
    }catch(e){
      // モデル廃止時、Google側のエラー文言に代替モデル名("...use models/xxx...")が
      // 含まれていることがあるため、それを拾って1回だけ自動リトライする
      const m = /use\s+models\/([a-zA-Z0-9._-]+)/i.exec(e.message);
      if(m && m[1] && m[1] !== model){
        model = m[1];
        data = await callGeminiGenerateContent(model, prompt, settings.geminiKey);
        // 次回から新しいモデル名を使うよう設定にも保存しておく
        settings.geminiModel = model;
        fGeminiModel.value = model;
        try{ localStorage.setItem('zen:settings:github', JSON.stringify(settings)); }catch(_e){}
      }else{
        throw e;
      }
    }

    const resultText = (data.candidates?.[0]?.content?.parts || [])
      .map(p => p.text || '').join('');
    if(!resultText.trim()){
      throw new Error('変換結果が空でした');
    }

    const resultLines = resultText.replace(/\n+$/,'').split('\n');
    const newCurrentLine = resultLines.pop() ?? '';
    fullText = resultLines.length > 0 ? resultLines.map(l => l + '\n').join('') : '';
    editor.value = newCurrentLine;
    editor.setSelectionRange(newCurrentLine.length, newCurrentLine.length);
    updateCaretPosition();
    updateCount();
    scheduleDraftSave();

  }catch(e){
    showError('変換に失敗しました: ' + e.message);
  }finally{
    convertBtn.disabled = false;
    convertBtn.textContent = '漢字変換';
  }
}

async function doSave(){
  const text = currentFullText();
  if(!text.trim()) return;

  if(!settings || !settings.token || !settings.owner || !settings.repo){
    openSettings();
    showError('先に接続設定を入力してください');
    return;
  }

  saveBtn.disabled = true;
  saveBtn.textContent = '投稿中…';

  const name = timestampName();
  const path = `${settings.folder}/${name}.md`;
  const firstLine = text.split('\n').find(l=>l.trim().length>0) || name;
  const commitMsg = `Zen: ${firstLine.slice(0,40)}`;

  const apiUrl = `https://api.github.com/repos/${settings.owner}/${settings.repo}/contents/${path}`;
  const fetchOpts = {
    method: 'PUT',
    headers: {
      'Authorization': `Bearer ${settings.token}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      message: commitMsg,
      content: b64EncodeUnicode(text),
      branch: settings.branch || 'main'
    })
  };

  try{
    let res = await fetch(apiUrl, fetchOpts);

    // GitHub側の一時的な401のことがあるため、1回だけ間を置いて自動リトライする
    if(res.status === 401){
      await new Promise(r => setTimeout(r, 1000));
      res = await fetch(apiUrl, fetchOpts);
    }

    if(!res.ok){
      const errData = await res.json().catch(()=>({}));
      throw new Error(errData.message || `GitHub API error (${res.status})`);
    }

    playStamp();
    fullText = '';
    editor.value = '';
    updateCaretPosition();
    updateCount();
    try{ localStorage.removeItem('zen:draft:current'); }catch(e){}

  }catch(e){
    showError('投稿に失敗しました: ' + e.message);
  }finally{
    saveBtn.disabled = false;
    saveBtn.textContent = '投稿する（⌘+Enter）';
  }
}

editor.addEventListener('compositionstart', ()=>{ isComposing = true; });
// モバイルのIMEは変換確定前(下線状態)の間、inputイベントが安定して飛ばないことがあるため、
// compositionupdate でも都度キャレット位置を更新して追従させる
editor.addEventListener('compositionupdate', ()=>{
  updateCaretPosition();
  updateCount();
  scheduleDraftSave();
});
editor.addEventListener('compositionend', ()=>{
  isComposing = false;
  updateCaretPosition();
  updateCount();
  scheduleDraftSave();
});

editor.addEventListener('input', ()=>{
  updateCaretPosition();
  updateCount();
  scheduleDraftSave();
});

editor.addEventListener('keyup', (e)=>{
  // 矢印キー等でのキャレット移動もガイドに追従させる
  if(e.key.startsWith('Arrow') || e.key === 'Home' || e.key === 'End'){
    updateCaretPosition();
  }
});
editor.addEventListener('click', updateCaretPosition);
editor.addEventListener('select', updateCaretPosition);
editor.addEventListener('focus', updateCaretPosition);

editor.addEventListener('keydown', (e)=>{
  if((e.metaKey || e.ctrlKey) && e.key === 'Enter'){
    if(isComposing) return;
    e.preventDefault();
    doSave();
    return;
  }
  if(e.key === 'Enter'){
    if(isComposing) return; // IME変換確定のEnterは横取りしない
    e.preventDefault();
    commitLine();
    return;
  }
  if(e.key === 'Backspace'){
    if(isComposing) return;
    const atStart = editor.selectionStart === 0 && editor.selectionEnd === 0;
    if(atStart && fullText.length > 0){
      e.preventDefault();
      const restored = popLastLine();
      if(restored !== null){
        const rest = editor.value;
        editor.value = restored + rest;
        editor.setSelectionRange(restored.length, restored.length);
        updateCaretPosition();
        updateCount();
        scheduleDraftSave();
      }
    }
  }
});

saveBtn.addEventListener('click', doSave);
convertBtn.addEventListener('click', doConvert);
gearBtn.addEventListener('click', openSettings);
document.getElementById('saveSettingsBtn').addEventListener('click', saveSettings);
document.getElementById('clearBtn').addEventListener('click', clearSettings);
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.classList.remove('open'); });
window.addEventListener('resize', updateCaretPosition);
// iOSでソフトキーボードの表示/非表示によりビューポートが変わったときも追従させる
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', updateCaretPosition);
}

// 一部環境で、position:fixed + overflow:hidden な要素の初回描画時に
// left/transform の計算がズレることがあるため、DOM上で一度取り外して
// 同じ場所へ戻すことで強制的に再レイアウトさせておく（保険的対策）
function forceRelayout(el){
  const parent = el.parentNode;
  const next = el.nextSibling;
  parent.removeChild(el);
  parent.insertBefore(el, next);
}

(async function init(){
  await loadSettings();
  await loadDraft();
  if(document.fonts && document.fonts.ready){
    try{ await document.fonts.ready; }catch(e){}
  }
  syncMeasureFont();
  updateCount();
  updateCaretPosition();
  editor.focus();
  if(!settings){
    setTimeout(openSettings, 400);
  }
  // 初回レイアウト直後に強制再レイアウトを実行(setTimeoutでイベントループを1周させてから)
  setTimeout(()=>{
    forceRelayout(document.getElementById('typewriter'));
    updateCaretPosition();
  }, 60);
})();
</script>
