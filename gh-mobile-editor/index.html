<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="禅ノート">
<title>禅ノート - Notebook Inbox</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Zen+Old+Mincho:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1C1B19;
    --paper:#EAE4D8;
    --muted:#8C8577;
    --hairline:#33312C;
    --hanko:#B23A2E;
    --hanko-glow:rgba(178,58,46,0.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100dvh;}
  body{
    background:var(--bg);
    color:var(--paper);
    font-family:'Noto Serif JP','Zen Old Mincho', serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* spine label: 実際に見えている高さ(dvh)基準で中央に固定 */
  .spine{
    position:fixed;
    left:clamp(14px, 3vw, 36px);
    top:50dvh;
    transform:translateY(-50%);
    writing-mode:vertical-rl;
    letter-spacing:0.5em;
    font-size:15px;
    color:var(--muted);
    opacity:0.55;
    user-select:none;
    pointer-events:none;
  }
  .spine .dot{
    display:block;
    width:4px;height:4px;
    border-radius:50%;
    background:var(--hanko);
    margin:0 auto 14px;
    opacity:0.8;
  }

  /* main writing surface: 入力エリアが画面の上下中央に来るよう固定 */
  .stage{
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .sheet{
    width:min(680px, 86vw);
  }
  textarea{
    width:100%;
    min-height:64dvh;
    background:transparent;
    border:none;
    outline:none;
    resize:none;
    color:var(--paper);
    font-family:'Noto Serif JP','Zen Old Mincho', serif;
    font-weight:300;
    font-size:19px;
    line-height:2.15;
    letter-spacing:0.02em;
  }
  textarea::placeholder{
    color:var(--muted);
    opacity:0.55;
  }
  textarea::-webkit-scrollbar{ width:0; }

  /* settings gear */
  .gear{
    position:fixed;
    top:calc(22px + env(safe-area-inset-top)); right:calc(26px + env(safe-area-inset-right));
    width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    color:var(--muted);
    opacity:0.28;
    cursor:pointer;
    transition:opacity .3s ease, transform .4s ease;
    background:none; border:none;
  }
  .gear:hover{ opacity:0.9; transform:rotate(35deg); }
  .gear svg{ width:17px; height:17px; }

  /* status row */
  .status{
    position:fixed;
    bottom:calc(22px + env(safe-area-inset-bottom));
    left:0; right:0;
    display:flex;
    justify-content:center;
  }
  .status-inner{
    width:min(680px, 86vw);
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.03em;
  }
  .count{ opacity:0.7; }
  .save-hint{
    cursor:pointer;
    opacity:0.75;
    transition:opacity .2s, color .2s;
    background:none; border:none;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.03em;
  }
  .save-hint:hover{ opacity:1; color:var(--paper); }
  .save-hint:disabled{ opacity:0.3; cursor:default; }

  .err{
    position:fixed;
    bottom:calc(52px + env(safe-area-inset-bottom)); left:0; right:0;
    display:flex; justify-content:center;
    pointer-events:none;
  }
  .err-inner{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--hanko);
    background:var(--hanko-glow);
    padding:6px 12px;
    border-radius:2px;
    opacity:0;
    transition:opacity .3s ease;
  }
  .err-inner.show{ opacity:1; }

  /* hanko stamp */
  .hanko-stamp{
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%) scale(0.4) rotate(-8deg);
    width:104px; height:104px;
    border:3px solid var(--hanko);
    border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    color:var(--hanko);
    font-family:'Zen Old Mincho', serif;
    font-size:44px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s cubic-bezier(.2,1.4,.4,1);
    box-shadow:0 0 40px var(--hanko-glow);
  }
  .hanko-stamp.stamped{
    opacity:0.92;
    transform:translate(-50%,-50%) scale(1) rotate(-8deg);
  }
  .hanko-stamp.fadeout{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.08) rotate(-8deg);
    transition:opacity .6s ease, transform .6s ease;
  }

  /* settings modal */
  .overlay{
    position:fixed; inset:0;
    background:rgba(10,10,9,0.72);
    display:none;
    align-items:center; justify-content:center;
    z-index:20;
  }
  .overlay.open{ display:flex; }
  .modal{
    width:min(400px, 88vw);
    background:#211F1C;
    border:1px solid var(--hairline);
    border-radius:4px;
    padding:28px 26px 22px;
    max-height:86vh;
    overflow-y:auto;
  }
  .modal h2{
    font-size:15px;
    font-weight:400;
    letter-spacing:0.08em;
    color:var(--paper);
    margin-bottom:4px;
  }
  .modal .sub{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--muted);
    margin-bottom:20px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    color:var(--muted);
    margin-bottom:6px;
    letter-spacing:0.04em;
  }
  .field input{
    width:100%;
    background:#171614;
    border:1px solid var(--hairline);
    border-radius:3px;
    padding:9px 10px;
    color:var(--paper);
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    outline:none;
  }
  .field input:focus{ border-color:var(--muted); }
  .modal-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
  }
  .btn{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.03em;
    padding:9px 16px;
    border-radius:3px;
    cursor:pointer;
    border:1px solid transparent;
  }
  .btn-primary{
    background:var(--hanko);
    color:#F4EDE4;
    border-color:var(--hanko);
  }
  .btn-primary:hover{ opacity:0.9; }
  .btn-ghost{
    background:none;
    color:var(--muted);
    border-color:var(--hairline);
  }
  .btn-ghost:hover{ color:var(--paper); }
</style>
</head>
<body>

  <div class="spine"><span class="dot"></span>禅モード</div>

  <button class="gear" id="gearBtn" title="設定" aria-label="設定">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>

  <div class="stage">
    <div class="sheet">
      <textarea id="editor" placeholder="書き始める……" autofocus spellcheck="false"></textarea>
    </div>
  </div>

  <div class="status">
    <div class="status-inner">
      <span class="count" id="count">0字</span>
      <button class="save-hint" id="saveBtn">投稿する（⌘+Enter）</button>
    </div>
  </div>

  <div class="err"><div class="err-inner" id="errBox"></div></div>

  <div class="hanko-stamp" id="stamp">済</div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2>接続設定</h2>
      <div class="sub">GitHub Personal Access Token が必要です（対象リポジトリの Contents: Read and write）</div>

      <div class="field">
        <label>Token</label>
        <input type="password" id="f-token" placeholder="github_pat_xxxxxxxxxxxx" autocomplete="off">
      </div>
      <div class="field">
        <label>リポジトリ所有者</label>
        <input type="text" id="f-owner" placeholder="例: plzsayyes3">
      </div>
      <div class="field">
        <label>リポジトリ名</label>
        <input type="text" id="f-repo" placeholder="例: mynotebook">
      </div>
      <div class="field">
        <label>ブランチ</label>
        <input type="text" id="f-branch" placeholder="main">
      </div>
      <div class="field">
        <label>保存フォルダ</label>
        <input type="text" id="f-folder" placeholder="00_inbox">
      </div>

      <div class="modal-actions">
        <button class="btn btn-ghost" id="clearBtn">接続を解除</button>
        <button class="btn btn-primary" id="saveSettingsBtn">保存して閉じる</button>
      </div>
    </div>
  </div>

<script>
"use strict";

// このアプリの初期値（未設定時のプリセット。設定画面でいつでも変更可能）
const DEFAULTS = {
  owner: "plzsayyes3",
  repo: "mynotebook",
  branch: "main",
  folder: "00_inbox",
};

const editor = document.getElementById('editor');
const countEl = document.getElementById('count');
const saveBtn = document.getElementById('saveBtn');
const gearBtn = document.getElementById('gearBtn');
const overlay = document.getElementById('overlay');
const stamp = document.getElementById('stamp');
const errBox = document.getElementById('errBox');

const fToken = document.getElementById('f-token');
const fOwner = document.getElementById('f-owner');
const fRepo = document.getElementById('f-repo');
const fBranch = document.getElementById('f-branch');
const fFolder = document.getElementById('f-folder');

let settings = null;
let draftTimer = null;

function showError(msg){
  errBox.textContent = msg;
  errBox.classList.add('show');
  setTimeout(()=> errBox.classList.remove('show'), 4200);
}

function updateCount(){
  countEl.textContent = editor.value.length + '字';
}

async function loadSettings(){
  try{
    const raw = localStorage.getItem('zen:settings:github');
    if(raw){ settings = JSON.parse(raw); }
  }catch(e){ /* no settings saved yet */ }
}

async function saveSettings(){
  const obj = {
    token: fToken.value.trim(),
    owner: fOwner.value.trim() || DEFAULTS.owner,
    repo: fRepo.value.trim() || DEFAULTS.repo,
    branch: fBranch.value.trim() || DEFAULTS.branch,
    folder: (fFolder.value.trim() || DEFAULTS.folder).replace(/^\/+|\/+$/g,'')
  };
  try{
    localStorage.setItem('zen:settings:github', JSON.stringify(obj));
    settings = obj;
    overlay.classList.remove('open');
  }catch(e){
    showError('設定の保存に失敗しました');
  }
}

async function clearSettings(){
  // トークンを含む接続情報だけを消す。書きかけの下書き(zen:draft:current)は消さない。
  try{
    localStorage.removeItem('zen:settings:github');
  }catch(e){}
  settings = null;
  fToken.value=''; fOwner.value=''; fRepo.value=''; fBranch.value=''; fFolder.value='';
  overlay.classList.remove('open');
}

function openSettings(){
  const s = settings || {};
  fToken.value = s.token || '';
  fOwner.value = s.owner || DEFAULTS.owner;
  fRepo.value = s.repo || DEFAULTS.repo;
  fBranch.value = s.branch || DEFAULTS.branch;
  fFolder.value = s.folder || DEFAULTS.folder;
  overlay.classList.add('open');
}

async function loadDraft(){
  try{
    const raw = localStorage.getItem('zen:draft:current');
    if(raw){
      editor.value = raw;
      updateCount();
    }
  }catch(e){ /* no draft */ }
}

function scheduleDraftSave(){
  clearTimeout(draftTimer);
  draftTimer = setTimeout(()=>{
    try{
      localStorage.setItem('zen:draft:current', editor.value);
    }catch(e){ /* silent - draft save is best-effort */ }
  }, 900);
}

function pad(n){ return String(n).padStart(2,'0'); }

// 既存の 00_inbox ファイル名規則 (例: 20260817223019.md) に合わせ、区切り文字なしのYYYYMMDDHHMMSS
function timestampName(){
  const d = new Date();
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}

function b64EncodeUnicode(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (_, p1) =>
    String.fromCharCode(parseInt(p1, 16))
  ));
}

function playStamp(){
  stamp.classList.remove('fadeout');
  stamp.classList.add('stamped');
  setTimeout(()=>{
    stamp.classList.add('fadeout');
    stamp.classList.remove('stamped');
  }, 900);
}

async function doSave(){
  const text = editor.value;
  if(!text.trim()) return;

  if(!settings || !settings.token || !settings.owner || !settings.repo){
    openSettings();
    showError('先に接続設定を入力してください');
    return;
  }

  saveBtn.disabled = true;
  saveBtn.textContent = '投稿中…';

  const name = timestampName();
  const path = `${settings.folder}/${name}.md`;
  const firstLine = text.split('\n').find(l=>l.trim().length>0) || name;
  const commitMsg = `Zen: ${firstLine.slice(0,40)}`;

  const apiUrl = `https://api.github.com/repos/${settings.owner}/${settings.repo}/contents/${path}`;
  const fetchOpts = {
    method: 'PUT',
    headers: {
      'Authorization': `Bearer ${settings.token}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      message: commitMsg,
      content: b64EncodeUnicode(text),
      branch: settings.branch || 'main'
    })
  };

  try{
    let res = await fetch(apiUrl, fetchOpts);

    // GitHub側の一時的な401のことがあるため、1回だけ間を置いて自動リトライする
    // （トークン自体は消さないので、本当に無効な場合だけエラーが表示され続ける）
    if(res.status === 401){
      await new Promise(r => setTimeout(r, 1000));
      res = await fetch(apiUrl, fetchOpts);
    }

    if(!res.ok){
      const errData = await res.json().catch(()=>({}));
      throw new Error(errData.message || `GitHub API error (${res.status})`);
    }

    playStamp();
    editor.value = '';
    updateCount();
    try{ localStorage.removeItem('zen:draft:current'); }catch(e){}

  }catch(e){
    showError('投稿に失敗しました: ' + e.message);
  }finally{
    saveBtn.disabled = false;
    saveBtn.textContent = '投稿する（⌘+Enter）';
  }
}

editor.addEventListener('input', ()=>{
  updateCount();
  scheduleDraftSave();
});

editor.addEventListener('keydown', (e)=>{
  if((e.metaKey || e.ctrlKey) && e.key === 'Enter'){
    e.preventDefault();
    doSave();
  }
});

saveBtn.addEventListener('click', doSave);
gearBtn.addEventListener('click', openSettings);
document.getElementById('saveSettingsBtn').addEventListener('click', saveSettings);
document.getElementById('clearBtn').addEventListener('click', clearSettings);
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.classList.remove('open'); });

(async function init(){
  await loadSettings();
  await loadDraft();
  updateCount();
  editor.focus();
  if(!settings){
    setTimeout(openSettings, 400);
  }
})();
</script>
</body>
</html>
